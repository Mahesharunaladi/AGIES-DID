services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SPIRE_JOIN_TOKEN: ${SPIRE_JOIN_TOKEN:?SPIRE_JOIN_TOKEN is required}
      PARSEABLE_USERNAME: ${PARSEABLE_USERNAME:?PARSEABLE_USERNAME is required}
      PARSEABLE_PASSWORD: ${PARSEABLE_PASSWORD:?PARSEABLE_PASSWORD is required}
      PARSEABLE_BASIC_AUTH: ${PARSEABLE_BASIC_AUTH:?PARSEABLE_BASIC_AUTH is required}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      OPA_URL: http://opa:8181/v1/data/agies/authz/decision
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
    depends_on:
      opa:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - agies

  opa:
    image: openpolicyagent/opa:0.70.0
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    volumes:
      - ./infra/opa:/policies:ro
    networks:
      - agies

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - neo4j-data:/data
    networks:
      - agies

  parseable:
    image: parseable/parseable:v1.6.4
    command: ["parseable", "local-store"]
    environment:
      P_USERNAME: ${PARSEABLE_USERNAME:?PARSEABLE_USERNAME is required}
      P_PASSWORD: ${PARSEABLE_PASSWORD:?PARSEABLE_PASSWORD is required}
      P_ADDR: 0.0.0.0:8000
    ports:
      - "8081:8000"
    volumes:
      - parseable-data:/parseable/data
    networks:
      - agies

  fluent-bit:
    image: fluent/fluent-bit:3.1.9
    volumes:
      - ./infra/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/log:/host/var/log:ro
    environment:
      PARSEABLE_BASIC_AUTH: ${PARSEABLE_BASIC_AUTH:?PARSEABLE_BASIC_AUTH is required}
    depends_on:
      - parseable
    networks:
      - agies

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      PARSEABLE_URL: http://parseable:8000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - parseable
    networks:
      - agies

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.10.2
    profiles: ["identity"]
    command: ["-config", "/run/spire/server/server.conf"]
    volumes:
      - ./infra/spire/server:/run/spire/server:ro
      - spire-server-data:/run/spire/data
    networks:
      - agies

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.10.2
    profiles: ["identity"]
    command: ["-config", "/run/spire/agent/agent.conf"]
    pid: host
    privileged: true
    volumes:
      - ./infra/spire/agent:/run/spire/agent:ro
      - spire-agent-socket:/run/spire/sockets
    depends_on:
      - spire-server
    networks:
      - agies

  mock-agent:
    image: curlimages/curl:8.10.1
    profiles: ["demo"]
    command:
      - sh
      - -c
      - |
        while true; do
          curl -sS -X POST http://gateway:8000/api/v1/trust/evaluate \
            -H 'Content-Type: application/json' \
            -d '{"agentId":"dev-ai-agent","prompt":"summarize audit records","requestedTools":["audit-read","ledger-read"],"context":{"mode":"demo"}}';
          sleep 30;
        done
    depends_on:
      - gateway
    networks:
      - agies

  tetragon:
    image: quay.io/cilium/tetragon:v1.2.1
    profiles: ["kernel-telemetry"]
    privileged: true
    pid: host
    volumes:
      - /sys/kernel:/sys/kernel:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - tetragon-logs:/var/run/cilium
    networks:
      - agies

networks:
  agies:
    driver: bridge

volumes:
  grafana-data:
  neo4j-data:
  parseable-data:
  spire-server-data:
  spire-agent-socket:
  tetragon-logs:
