apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agies-gateway-egress
  namespace: agies
spec:
  podSelector:
    matchLabels:
      app: agies-gateway
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: opa
      ports:
        - protocol: TCP
          port: 8181
    - to:
        - podSelector:
            matchLabels:
              app: neo4j
      ports:
        - protocol: TCP
          port: 7687
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agies-low-trust-isolation
  namespace: agies
spec:
  podSelector:
    matchLabels:
      trust-band: low
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agies-gateway
      ports:
        - protocol: TCP
          port: 8000
