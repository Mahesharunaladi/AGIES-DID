server:
  port: ${PORT:8000}

debug: false

spring:
  application:
    name: agies-did-gateway

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

management:
  health:
    neo4j:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

agies:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
  opa:
    url: ${OPA_URL:http://localhost:8181/v1/data/agies/authz/decision}
    timeout-seconds: ${OPA_TIMEOUT_SECONDS:1}
  neo4j:
    enabled: ${NEO4J_ENABLED:false}
    uri: ${NEO4J_URI:bolt://localhost:7687}
    username: ${NEO4J_USERNAME:neo4j}
    password: ${NEO4J_PASSWORD:change-me}
    timeout-seconds: ${NEO4J_TIMEOUT_SECONDS:1}
  trust:
    baseline-score: ${TRUST_BASELINE_SCORE:0.82}
    low-trust-threshold: ${TRUST_LOW_THRESHOLD:0.45}
  ttl:
    high-trust-seconds: ${SVID_TTL_HIGH_SECONDS:3600}
    medium-trust-seconds: ${SVID_TTL_MEDIUM_SECONDS:900}
    low-trust-seconds: ${SVID_TTL_LOW_SECONDS:120}
