[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name         tail
    Path         /host/var/log/*.log
    Tag          host.*
    Read_from_Head false

[OUTPUT]
    Name         http
    Match        *
    Host         parseable
    Port         8000
    URI          /api/v1/ingest
    Format       json
    Header       Authorization ${PARSEABLE_BASIC_AUTH}
    Header       X-P-Stream agies_audit
